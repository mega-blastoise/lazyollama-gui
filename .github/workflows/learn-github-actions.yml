name: learn-github-actions
run-name: ${{ github.actor }} is learning GitHub Actions
on: [push]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g bats
      - run: bats -v
  fake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run build
        run: echo "Running build..."

  fake-build-deployer:
    runs-on: ubuntu-latest
    needs: [check-bats-version, fake-build]
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Built project
        run: |
          echo "Deploying the project..."
          # Add your deploying commands here
      - name: Running two things in one Job
        run: |
          echo "Finishing up the deployment..."